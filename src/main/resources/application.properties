spring.application.name=demo
server.port=8080

# ==========================================
# CẤU HÌNH KẾT NỐI SQL SERVER (TK: sa / MK: 16052006)
# ==========================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bbcare_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# SPRING DATA JPA & HIBERNATE (TỰ TẠO BẢNG)
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ==========================================
# THYMELEAF & STATIC RESOURCES
# ==========================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.web.resources.static-locations=classpath:/static/
